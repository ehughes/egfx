# eGFX Configuration
CONFIG_EGFX=y

# Display Configuration
CONFIG_EGFX_PHYSICAL_SCREEN_SIZE_X=320
CONFIG_EGFX_PHYSICAL_SCREEN_SIZE_Y=172
CONFIG_EGFX_DISPLAY_DRIVER_IMG_TYPE=EGFX_IMG_16BPP_RGB565

# Zephyr Display Driver
CONFIG_DISPLAY=y
CONFIG_SDL_DISPLAY=y
CONFIG_SDL_DISPLAY_DEFAULT_PIXEL_FORMAT_RGB_565=y

# Console and Logging
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Heap size
CONFIG_HEAP_MEM_POOL_SIZE=65536
